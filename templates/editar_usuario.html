{% extends 'base.html' %}

{% block titulo %}
Editar Usuário
{% endblock %}

{% block conteudo %}

<h1 style="
margin-bottom:30px;">

    Editar Usuário

</h1>

<form method="POST">

    <input
    type="text"
    name="username"
    value="{{ user.username }}"
    required>

    <input
    type="password"
    name="password"
    placeholder="Nova senha">

    <select name="role">

        <option value="Cliente"
        {% if user.role == 'Cliente' %}
        selected
        {% endif %}>

            Cliente

        </option>

        <option value="Funcionario"
        {% if user.role == 'Funcionario' %}
        selected
        {% endif %}>

            Funcionário

        </option>

        <option value="Admin"
        {% if user.role == 'Admin' %}
        selected
        {% endif %}>

            Admin

        </option>

    </select>

    <button type="submit">

        Salvar Alterações

    </button>

</form>

{% endblock %}
