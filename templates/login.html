{% extends 'base.html' %}

{% block titulo %}
Login - FoodGo
{% endblock %}

{% block conteudo %}

<div class="form-container">

    <form method="POST">

        <h1>FoodGo</h1>

        <p style="
        text-align:center;
        color:#999;
        margin-bottom:20px;">

            Faça login para continuar

        </p>

        <input
        type="text"
        name="username"
        placeholder="Usuário"
        required>

        <input
        type="password"
        name="password"
        placeholder="Senha"
        required>

        <button type="submit">

            Entrar

        </button>

        <p class="link">

            Não possui conta?

            <a href="{{ url_for('cadastro') }}">

                Criar conta

            </a>

        </p>

    </form>

</div>

{% endblock %}
