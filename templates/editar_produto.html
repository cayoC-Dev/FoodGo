{% extends 'base.html' %}

{% block titulo %}
Editar Produto
{% endblock %}

{% block conteudo %}

<h1 style="margin-bottom:30px;">

    Editar Produto

</h1>

<form method="POST">

    <input
    type="text"
    name="nome"
    value="{{ produto.nome }}"
    required>

    <input
    type="number"
    step="0.01"
    name="preco"
    value="{{ produto.preco }}"
    required>

    <input
    type="text"
    name="categoria"
    value="{{ produto.categoria }}">

    <input
    type="text"
    name="imagem"
    value="{{ produto.imagem }}">

    <input
    type="number"
    name="estoque"
    value="{{ produto.estoque }}">

    <input
    type="text"
    name="descricao"
    value="{{ produto.descricao }}">

    <button type="submit">

        Salvar Alterações

    </button>

</form>

{% endblock %}
