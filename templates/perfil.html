{% extends 'base.html' %}

{% block titulo %}
Perfil
{% endblock %}

{% block conteudo %}

<h1 style="
margin-bottom:30px;">

    Meu Perfil

</h1>

<form method="POST">

    <input
    type="text"
    name="username"
    value="{{ current_user.username }}"
    required>

    <input
    type="password"
    name="password"
    placeholder="Nova senha">

    <button type="submit">

        Atualizar Perfil

    </button>

</form>

{% endblock %}
